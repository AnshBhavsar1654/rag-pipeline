[project]
name = "rag"
version = "0.1.0"
description = "Modular RAG pipeline: query translation, routing, query construction, graph/SQL/vector stores, CRAG and Self-RAG"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.5.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.3.0",
    "pydantic>=2.0",
    "pypdf>=4.0.0",
    "pyyaml>=6.0",
    "tiktoken>=0.7.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "pdfplumber>=0.10.0",
    "pdf2image>=1.16.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.3.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0.0",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "rank-bm25>=0.2.2",
    "docx2txt>=0.9",
    "python-docx>=1.2.0",
    "grand-cypher>=1.2.0",
    "ddgs>=9.16.1",
    "fastapi>=0.163.1",
    "uvicorn>=0.52.4",
    "python-multipart>=0.0.33",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "pymupdf>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
