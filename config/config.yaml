# --- Document Sources ---
# Supported: file paths (pdf, txt, md, docx, csv, html), URLs, directories
documents:
  sources:
    - "./sample_docs/"   # Put your documents in this folder
    # - "https://example.com/article"
    # - "./my_report.pdf"
    # - "./data/notes.md"

# --- Chunking ---
chunking:
  # Units are tokens when use_tiktoken is true, characters otherwise.
  # Keep chunk_size under the embedding model's input limit (512 tokens for
  # bge-small, 256 for all-MiniLM) or the end of each chunk is never embedded.
  chunk_size: 400
  chunk_overlap: 60
  use_tiktoken: true        # Use tiktoken-aware splitting
  tiktoken_encoding: "cl100k_base"

# --- Embedding Model ---
embedding:
  # Changing the embedding model requires re-running `python ingest.py`;
  # the app refuses (or auto-rebuilds) an index built with a different model.
  provider: "huggingface"     # google | openai | huggingface
  model: "BAAI/bge-small-en-v1.5"
  query_instruction: "Represent this sentence for searching relevant passages: "
  # For OpenAI:
  # provider: "openai"
  # model: "text-embedding-3-small"
  # For HuggingFace (local, free):
  # provider: "huggingface"
  # model: "sentence-transformers/all-MiniLM-L6-v2"   # (set query_instruction: "")

# --- Vector Store ---
vectorstore:
  provider: "chroma"        # chroma (default)
  persist_directory: "./vectorstore_db"
  collection_name: "rag_collection"

# --- Relational DB ---
# Tables found in PDFs/DOCX and CSV files are loaded into SQLite and queried
# with Text-to-SQL when the router decides a question needs them.
relational_db:
  enabled: true
  path: "./data/relational.sqlite"
  max_rows: 50              # Rows of a SQL result passed to the LLM

# --- LLM ---
llm:
  provider: "google"         # google | groq | openai | ollama
  model: "gemini-3.6-flash"  # Model name
  temperature: 0.1
  max_tokens: 2048
  max_retries: 3             # Retry transient API errors (rate limits, 503s)
  # Used automatically when the primary model errors (e.g. 503 overloaded).
  # Remove this block to disable. Needs that provider's API key in .env.
  fallback:
    provider: "groq"
    model: "openai/gpt-oss-120b"
  # For Groq (fast, free tier):
  # provider: "groq"
  # model: "openai/gpt-oss-120b"
  # For OpenAI:
  # provider: "openai"
  # model: "gpt-4o-mini"
  # For Ollama (local):
  # provider: "ollama"
  # model: "llama3"
  # base_url: "http://localhost:11434"

# --- Retrieval Strategy ---
retrieval:
  strategy: "rag_fusion"    # simple | multi_query | rag_fusion | hyde | step_back | decomposition
  top_k: 5                  # Chunks passed to the LLM (when re-ranking is off)

  # Hybrid search: fuse dense vector search with BM25 keyword search (RRF).
  # Helps with names, IDs, and rare terms that embeddings blur together.
  hybrid:
    enabled: true
    fetch_k: 20              # Candidates taken from each of dense and BM25
    rrf_k: 60
  
  # Multi-query settings
  multi_query:
    num_queries: 4           # Number of query variants to generate

  # RAG-Fusion settings  
  rag_fusion:
    num_queries: 4           # Number of query variants
    rrf_k: 60               # RRF constant (higher = more weight to lower ranks)

  # HyDE settings
  hyde:
    hypothesis_prompt: "Please write a detailed passage to answer the question:\nQuestion: {question}\nPassage:"

# --- Re-ranking (optional) ---
reranking:
  enabled: true
  provider: "cross_encoder"  # cross_encoder | cohere
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  candidates: 20            # Retrieved chunks the re-ranker scores
  top_k: 5                  # Chunks passed to the LLM after re-ranking
  # For Cohere:
  # provider: "cohere"
  # model: "rerank-english-v3.0"

# --- Image/Table Extraction ---
extraction:
  enabled: true
  ocr_enabled: true           # Extract text from images via OCR
  table_extraction: true      # Extract tables and convert to Markdown
  ocr_language: "eng"         # Tesseract language code (eng, fra, deu, etc.)
  min_table_rows: 2           # Minimum rows to consider something a table
  detect_scanned_pages: true  # Detect and OCR scanned PDF pages

# --- Chat / Conversation ---
chat:
  system_prompt: |
    You are a helpful AI assistant that answers questions based on the provided context.
    If you don't know the answer or the context doesn't contain relevant information,
    say so honestly. Always be concise and accurate.
  memory_window: 10          # Number of past exchanges to keep in memory
  show_sources: true         # Show source documents in responses
  rewrite_followups: true    # Turn follow-ups into standalone questions before searching

# --- Gradio UI ---
ui:
  title: "RAG Chatbot"
  description: "Ask questions about your documents"
  theme: "soft"              # soft | default | glass
  share: false               # Create public Gradio link
  port: 7860
